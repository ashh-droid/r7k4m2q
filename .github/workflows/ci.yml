name: test-and-build
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python dependencies
  	run: pip install -r backend/requirements.txt pytest httpx==0.28.1
      - name: Backend tests with January snapshot
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and production build
        working-directory: frontend
        run: npm ci && npm run build
